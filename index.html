<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <h1>회원가입</h1>
      <label for="userId">아이디</label>
      <input type="text" placeholder="예)ranni" id="userId" />

      <label for="upwd">비밀번호</label>
      <input type="text" placeholder="예)123456!" id="upwd" />

      <label for="cpwd">비밀번호 확인</label>
      <input type="text" id="cpwd" />
      <label for="dob">생년월일</label>
      <input type="text" placeholder="예)YYYYMMDD" id="dob" />

      <div>
        <button>회원가입</button>
        <button>취소</button>
      </div>
    </form>
  </body>
</html>
